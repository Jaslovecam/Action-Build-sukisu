name: Build SukiSU Kernel for OnePlus (sm8650)
on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: "内核源码分支"
        required: true
        default: 'fifteen'
      DEVICE_CODENAME:
        description: "设备代号"
        required: true
        default: 'pineapple'
      ANDROID_VERSION:
        description: "安卓版本"
        required: true
        default: 'android14'
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        default: '6.1'
      KERNEL_SUFFIX:
        description: "内核名称后缀"
        required: true
        default: '-SukiSU'
      SUSFS_ENABLED:
        description: "启用SUSFS功能"
        required: true
        type: boolean
        default: true
      HIDE_PATCHES:
        description: "启用隐藏补丁"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_DIR: kernel_platform
      WORKSPACE: kernel_workspace
      OUT_DIR: out
      ANYKERNEL: AnyKernel3
      TOOLCHAIN: clang
      KSU_BRANCH: susfs-stable

    steps:
      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt install -y -qq \
            git curl wget python3 python3-pip \
            gcc g++ make libssl-dev flex bison \
            bc dwarves libelf-dev zstd \
            clang llvm lld zip unzip ccache \
            libncurses5-dev libncursesw5-dev

      - name: 配置CCache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 初始化CCache
        run: |
          ccache -M 20G
          ccache -s

      - name: 下载内核源码
        run: |
          mkdir -p ${{ env.WORKSPACE }}
          cd ${{ env.WORKSPACE }}
          
          # 克隆内核源码
          git clone https://github.com/yaap/kernel_oneplus_sm8650.git -b ${{ github.event.inputs.BRANCH }} ${{ env.KERNEL_DIR }}
          
          # 进入内核目录
          cd ${{ env.KERNEL_DIR }}
          
          # 记录源码版本
          git rev-parse HEAD > source_commit.txt
          echo "内核源码版本: $(cat source_commit.txt | cut -c1-8)"

      - name: 集成SukiSU
        run: |
          cd ${{ env.WORKSPACE }}/${{ env.KERNEL_DIR }}
          
          # 下载并安装SukiSU
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/KernelSU/main/kernel/setup.sh" | bash -s ${{ env.KSU_BRANCH }}
          
          # 获取SukiSU版本号
          cd KernelSU
          KSU_VERSION=$(expr $(git rev-list --count HEAD) + 12505)
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "SukiSU版本: $KSU_VERSION"
          cd ..

      - name: 应用SUSFS补丁
        if: ${{ github.event.inputs.SUSFS_ENABLED == 'true' }}
        run: |
          cd ${{ env.WORKSPACE }}
          
          # 克隆SUSFS补丁仓库
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          
          # 进入内核目录
          cd ${{ env.KERNEL_DIR }}
          
          # 复制补丁文件
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          
          # 应用补丁
          echo "应用SUSFS补丁..."
          if ! patch -p1 < 50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch; then
            echo "SUSFS补丁应用失败!"
            exit 1
          fi

      - name: 应用隐藏补丁
        if: ${{ github.event.inputs.HIDE_PATCHES == 'true' }}
        run: |
          cd ${{ env.WORKSPACE }}
          
          # 克隆补丁仓库
          git clone https://github.com/cabagekiller/kernel_patches.git
          
          # 进入内核目录
          cd ${{ env.KERNEL_DIR }}
          
          # 应用隐藏补丁
          echo "应用隐藏补丁..."
          cp ../kernel_patches/69_hide_stuff.patch ./
          if ! patch -p1 -F 3 < 69_hide_stuff.patch; then
            echo "隐藏补丁应用失败!"
            exit 1
          fi

      - name: 配置内核选项
        run: |
          cd ${{ env.WORKSPACE }}/${{ env.KERNEL_DIR }}
          
          # 创建输出目录
          mkdir -p ${{ env.OUT_DIR }}
          
          # 加载基础配置
          make ARCH=arm64 O=${{ env.OUT_DIR }} \
            gki_defconfig \
            vendor/${{ github.event.inputs.DEVICE_CODENAME }}_GKI.config \
            vendor/oplus/${{ github.event.inputs.DEVICE_CODENAME }}_GKI.config \
            vendor/oplus/waffle.config
          
          # 配置SukiSU相关选项
          DEFCONFIG=${{ env.OUT_DIR }}/.config
          
          # 添加SukiSU配置
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=${{ github.event.inputs.SUSFS_ENABLED == 'true' && 'y' || 'n' }}" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_VFS=y" >> $DEFCONFIG
          echo "CONFIG_COMPAT=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          
          # 移除defconfig检查
          sed -i 's/check_defconfig//' ./build.config.gki
          
          # 修改内核名称
          sed -i "s/EXTRAVERSION =.*/EXTRAVERSION = ${{ github.event.inputs.KERNEL_SUFFIX }}/" Makefile
          if [ -f ./scripts/setlocalversion ]; then
            sed -i 's/-dirty//' ./scripts/setlocalversion
          fi

      - name: 编译内核
        run: |
          cd ${{ env.WORKSPACE }}/${{ env.KERNEL_DIR }}
          
          # 配置编译参数
          export ARCH=arm64
          export CC=${{ env.TOOLCHAIN }}
          export LLVM=1
          export LLVM_IAS=1
          export PATH="/usr/lib/ccache:$PATH"
          
          # 编译内核
          echo "开始编译内核..."
          make O=${{ env.OUT_DIR }} -j$(nproc --all)
          
          # 编译模块
          make O=${{ env.OUT_DIR }} modules_install INSTALL_MOD_PATH=./modules
          
          # 检查编译结果
          if [ ! -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "内核编译失败，未找到Image文件!"
            exit 1
          fi
          
          # 显示CCache统计
          ccache -s

      - name: 打包内核
        run: |
          # 设置时间戳
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          
          # 克隆AnyKernel3
          cd ${{ env.WORKSPACE }}
          git clone https://github.com/cabagekiller/AnyKernel3.git -b gki-2.0 ${{ env.ANYKERNEL }}
          
          # 复制内核镜像
          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image ${{ env.ANYKERNEL }}/
          
          # 复制模块
          mkdir -p ${{ env.ANYKERNEL }}/modules
          cp -r ${{ env.KERNEL_DIR }}/modules/lib/modules/* ${{ env.ANYKERNEL }}/modules/
          
          # 创建压缩包名称
          ZIP_NAME="${{ github.event.inputs.DEVICE_CODENAME }}-kernel-${{ github.event.inputs.KERNEL_VERSION }}-${{ env.KSU_VERSION }}-${TIMESTAMP}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          
          # 打包
          cd ${{ env.ANYKERNEL }}
          zip -r9 ../$ZIP_NAME * -x ".git*" "LICENSE" "README.md"
          
          # 验证打包结果
          if [ ! -f "../$ZIP_NAME" ]; then
            echo "打包失败，未找到ZIP文件!"
            exit 1
          fi
          
          # 移动到工作区根目录
          mv ../$ZIP_NAME ../../

      - name: 创建发布
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: suki-kernel-${{ github.event.inputs.DEVICE_CODENAME }}-${{ env.TIMESTAMP }}
          name: SukiSU Kernel ${{ github.event.inputs.KERNEL_VERSION }} for ${{ github.event.inputs.DEVICE_CODENAME }}
          body: |
            # SukiSU 内核发布
            
            - 设备: ${{ github.event.inputs.DEVICE_CODENAME }}
            - 内核版本: ${{ github.event.inputs.KERNEL_VERSION }}
            - 安卓版本: ${{ github.event.inputs.ANDROID_VERSION }}
            - SukiSU版本: ${{ env.KSU_VERSION }}
            - 构建时间: ${{ env.TIMESTAMP }}
            - 源码分支: ${{ github.event.inputs.BRANCH }}
            
            ## 功能
            - 集成SukiSU
            - ${{ github.event.inputs.SUSFS_ENABLED == 'true' && '已启用SUSFS' || '未启用SUSFS' }}
            - ${{ github.event.inputs.HIDE_PATCHES == 'true' && '已应用隐藏补丁' || '未应用隐藏补丁' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: success()
